<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Closing Iceberg</title>
  <style>
    :root {
      --ink: #06131d;
      --gold: #b98c3c;
      --gold-soft: #e6d3a4;
      --paper: #fff7ea;
      --muted: rgba(230, 211, 164, .55);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #071018;
      color: var(--paper);
      font-family: "Noto Serif SC", "Songti SC", "STSong", "PingFang SC", serif;
    }

    .stage {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 42%, rgba(43, 104, 134, .34), transparent 34%),
        radial-gradient(circle at 50% 72%, rgba(185, 140, 60, .10), transparent 30%),
        linear-gradient(180deg, #071b29 0%, #09283d 45%, #050e15 100%);
      isolation: isolate;
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(230,211,164,.026) 1px, transparent 1px),
        linear-gradient(90deg, rgba(230,211,164,.022) 1px, transparent 1px),
        radial-gradient(circle, rgba(255,255,255,.28) 0 1px, transparent 1px);
      background-size: 56px 56px, 56px 56px, 22px 24px;
      opacity: .62;
      z-index: -2;
    }

    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(0,0,0,.35), transparent 24%, transparent 78%, rgba(0,0,0,.36)),
        radial-gradient(ellipse at bottom, rgba(4, 12, 19, .78), transparent 52%);
      z-index: -1;
    }

    .frame {
      position: absolute;
      inset: 54px 64px;
      border: 1px solid rgba(185,140,60,.34);
      pointer-events: none;
    }

    .eyebrow {
      position: absolute;
      top: 104px;
      left: 50%;
      transform: translateX(-50%);
      padding: 9px 28px 8px;
      border: 1px solid rgba(185,140,60,.58);
      color: var(--gold-soft);
      font: 600 16px/1 "Avenir Next Condensed", "DIN Condensed", sans-serif;
      letter-spacing: 10px;
      text-transform: uppercase;
      background: rgba(6,19,29,.42);
      opacity: 0;
      animation: appear 1s ease-out .3s forwards;
    }

    .thoughts {
      position: absolute;
      left: 0;
      right: 0;
      top: 208px;
      text-align: center;
      color: var(--gold-soft);
      font: 400 31px/1.65 "PingFang SC", "Noto Sans SC", sans-serif;
      letter-spacing: 5px;
    }

    .line {
      opacity: 0;
      transform: translateY(18px);
      filter: blur(4px);
      animation: sentence 3.4s cubic-bezier(.2,.8,.2,1) forwards;
    }

    .line.a { animation-delay: .9s; }
    .line.b { animation-delay: 3.35s; }

    .iceberg {
      position: absolute;
      left: 50%;
      top: 404px;
      width: 520px;
      height: 380px;
      transform: translateX(-50%);
    }

    .waterline {
      position: absolute;
      left: -330px;
      right: -330px;
      top: 118px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(230,211,164,.78), transparent);
      opacity: 0;
      animation: appear 1.2s ease-out 5.8s forwards;
    }

    .waterline::after {
      content: "";
      position: absolute;
      left: 220px;
      right: 220px;
      top: 8px;
      height: 1px;
      background: repeating-linear-gradient(90deg, rgba(185,140,60,.50) 0 9px, transparent 9px 18px);
      opacity: .5;
    }

    .berg-top {
      position: absolute;
      left: 214px;
      top: 12px;
      width: 112px;
      height: 118px;
      clip-path: polygon(34% 98%, 58% 0, 70% 72%, 100% 84%, 82% 100%);
      background: linear-gradient(135deg, #fff0ca, #a98542);
      opacity: 0;
      animation: appear 1.1s ease-out 6.05s forwards;
    }

    .berg-under {
      position: absolute;
      left: 158px;
      top: 120px;
      width: 222px;
      height: 220px;
      clip-path: polygon(18% 0, 70% 0, 100% 54%, 56% 100%, 0 65%);
      border: 1px solid rgba(185,140,60,.42);
      background: linear-gradient(180deg, rgba(20,62,92,.20), rgba(6,19,29,.10));
      opacity: 0;
      animation: appear 1.1s ease-out 6.25s forwards;
    }

    .final-copy {
      position: absolute;
      left: 0;
      right: 0;
      top: 704px;
      text-align: center;
    }

    h1 {
      margin: 0;
      color: #fff8eb;
      font-size: 64px;
      line-height: 1;
      letter-spacing: 8px;
      font-weight: 800;
      opacity: 0;
      transform: translateY(24px);
      animation: rise 1s cubic-bezier(.2,.8,.2,1) 7.05s forwards;
      text-shadow: 0 0 30px rgba(255,248,235,.12);
    }

    .tagline {
      margin-top: 30px;
      color: var(--gold-soft);
      font: 400 31px/1.4 "PingFang SC", "Noto Sans SC", sans-serif;
      letter-spacing: 6px;
      opacity: 0;
      transform: translateY(18px);
      animation: rise 1s cubic-bezier(.2,.8,.2,1) 7.95s forwards;
    }

    .rule {
      position: absolute;
      left: 228px;
      right: 228px;
      bottom: 162px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(185,140,60,.68), transparent);
    }

    .footer {
      position: absolute;
      left: 132px;
      right: 132px;
      bottom: 64px;
      display: flex;
      justify-content: space-between;
      color: rgba(230,211,164,.42);
      font: 500 13px/1 "Avenir Next", sans-serif;
      letter-spacing: 7px;
      text-transform: uppercase;
    }

    body.final .eyebrow,
    body.final .line,
    body.final .waterline,
    body.final .berg-top,
    body.final .berg-under,
    body.final h1,
    body.final .tagline {
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
      filter: none !important;
    }

    body.final .iceberg {
      transform: translateX(-50%) !important;
    }

    @keyframes appear {
      to { opacity: 1; }
    }

    @keyframes rise {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes sentence {
      0% { opacity: 0; transform: translateY(18px); filter: blur(4px); }
      18% { opacity: 1; transform: translateY(0); filter: blur(0); }
      74% { opacity: 1; transform: translateY(0); filter: blur(0); }
      100% { opacity: 0; transform: translateY(-14px); filter: blur(5px); }
    }
  </style>
</head>
<body>
  <main class="stage">
    <div class="frame"></div>
    <div class="eyebrow">FINAL STATEMENT</div>

    <section class="thoughts">
      <div class="line a">AI 时代，长视频的内容消费方式</div>
      <div class="line b">不是创造更多自由的改变，而是让观众看到叙事的纵深。</div>
    </section>

    <section class="iceberg" aria-hidden="true">
      <div class="waterline"></div>
      <div class="berg-top"></div>
      <div class="berg-under"></div>
    </section>

    <section class="final-copy">
      <h1>每部剧都是一座冰山。</h1>
      <div class="tagline">你看到的，只是水面以上。</div>
    </section>

    <div class="rule"></div>
    <div class="footer">
      <span>QING YU · UNDERWATER</span>
      <span>VIDEO CLOSING ASSET</span>
    </div>
  </main>

  <script>
    if (new URLSearchParams(location.search).has("final")) {
      document.body.classList.add("final");
    }
  </script>
</body>
</html>
