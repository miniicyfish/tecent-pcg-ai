<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Opening Outflow Concept</title>
  <style>
    :root {
      --ink: #06131d;
      --sea: #08253a;
      --gold: #b98c3c;
      --gold-soft: #e6d3a4;
      --paper: #fff7ea;
      --muted: rgba(230, 211, 164, .58);
      --line: rgba(185, 140, 60, .50);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #071018;
      overflow: hidden;
      color: var(--paper);
      font-family: "Noto Serif SC", "Songti SC", "STSong", "PingFang SC", serif;
    }

    .stage {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background:
        radial-gradient(circle at 34% 48%, rgba(40, 103, 134, .34), transparent 34%),
        radial-gradient(circle at 78% 50%, rgba(185, 140, 60, .08), transparent 28%),
        linear-gradient(180deg, #071b29 0%, #09273b 44%, #050e15 100%);
      isolation: isolate;
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(230,211,164,.026) 1px, transparent 1px),
        linear-gradient(90deg, rgba(230,211,164,.022) 1px, transparent 1px),
        radial-gradient(circle, rgba(255,255,255,.28) 0 1px, transparent 1px);
      background-size: 56px 56px, 56px 56px, 22px 24px;
      opacity: .68;
      z-index: -2;
    }

    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(0,0,0,.32), transparent 24%, transparent 78%, rgba(0,0,0,.34)),
        radial-gradient(ellipse at bottom, rgba(4, 12, 19, .72), transparent 52%);
      z-index: -1;
    }

    .frame {
      position: absolute;
      inset: 54px 64px;
      border: 1px solid rgba(185,140,60,.34);
      pointer-events: none;
    }

    .eyebrow {
      position: absolute;
      top: 104px;
      left: 50%;
      transform: translateX(-50%);
      padding: 9px 28px 8px;
      border: 1px solid rgba(185,140,60,.58);
      color: var(--gold-soft);
      font: 600 16px/1 "Avenir Next Condensed", "DIN Condensed", sans-serif;
      letter-spacing: 10px;
      text-transform: uppercase;
      background: rgba(6,19,29,.42);
      white-space: nowrap;
    }

    .copy {
      position: absolute;
      left: 214px;
      top: 252px;
      width: 620px;
      opacity: 0;
      transform: translateY(22px);
      animation: fadeUp .8s cubic-bezier(.2,.8,.2,1) .12s forwards;
    }

    .kicker {
      color: var(--gold);
      font: 600 15px/1 "Avenir Next", "PingFang SC", sans-serif;
      letter-spacing: 9px;
      text-transform: uppercase;
      margin-bottom: 22px;
    }

    h1 {
      margin: 0;
      color: #fff8eb;
      font-size: 76px;
      line-height: 1.08;
      letter-spacing: 5px;
      font-weight: 800;
      text-shadow: 0 0 28px rgba(255,248,235,.10);
    }

    .sub {
      margin: 30px 0 0;
      color: var(--gold-soft);
      font: 400 28px/1.66 "PingFang SC", "Noto Sans SC", sans-serif;
      letter-spacing: 4px;
    }

    .diagram {
      position: absolute;
      right: 202px;
      top: 226px;
      width: 760px;
      height: 560px;
    }

    .diagram svg {
      position: absolute;
      inset: 0;
      overflow: visible;
    }

    .waterline {
      position: absolute;
      left: 20px;
      right: 20px;
      top: 242px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(230,211,164,.78), transparent);
    }

    .home {
      position: absolute;
      left: 34px;
      top: 124px;
      width: 260px;
      height: 238px;
      border: 1px solid rgba(185,140,60,.62);
      background:
        radial-gradient(circle at 52% 42%, rgba(230,211,164,.20), transparent 44%),
        rgba(6,19,29,.52);
      display: grid;
      place-items: center;
      text-align: center;
      color: #fff8eb;
      font-size: 42px;
      line-height: 1.26;
      letter-spacing: 4px;
      box-shadow: 0 0 80px rgba(35, 94, 126, .18);
    }

    .home small {
      display: block;
      margin-top: 18px;
      color: var(--muted);
      font: 500 14px/1 "Avenir Next", sans-serif;
      letter-spacing: 7px;
      text-transform: uppercase;
    }

    .gap {
      position: absolute;
      left: 336px;
      top: 210px;
      width: 128px;
      height: 96px;
      color: rgba(230,211,164,.72);
      font: 500 20px/1.4 "PingFang SC", sans-serif;
      letter-spacing: 4px;
      text-align: center;
      opacity: 0;
      animation: fadeIn .8s ease-out 1.05s forwards;
    }

    .gap::before,
    .gap::after {
      content: "";
      position: absolute;
      top: 48px;
      width: 42px;
      height: 1px;
      background: rgba(185,140,60,.58);
    }

    .gap::before { left: -54px; }
    .gap::after { right: -54px; }

    .node {
      position: absolute;
      width: 184px;
      padding: 18px 18px 17px;
      border: 1px solid rgba(230,211,164,.38);
      background: rgba(8, 37, 58, .52);
      color: #fff8eb;
      text-align: center;
      font: 600 28px/1.1 "PingFang SC", "Noto Sans SC", sans-serif;
      letter-spacing: 4px;
      opacity: 0;
      transform: translateY(16px);
      animation: rise .75s cubic-bezier(.2,.8,.2,1) forwards;
    }

    .node small {
      display: block;
      margin-top: 12px;
      color: rgba(230,211,164,.52);
      font: 500 12px/1 "Avenir Next", sans-serif;
      letter-spacing: 5px;
      text-transform: uppercase;
    }

    .node.a { right: 18px; top: 38px; animation-delay: .55s; }
    .node.b { right: 74px; top: 210px; animation-delay: .82s; }
    .node.c { right: 0; bottom: 112px; animation-delay: 1.1s; }
    .node.d { right: 256px; bottom: 40px; animation-delay: 1.38s; }

    .flow {
      fill: none;
      stroke: rgba(185,140,60,.48);
      stroke-width: 1.45;
      stroke-dasharray: 9 13;
      stroke-dashoffset: 760;
      opacity: 0;
      animation: draw 1.8s ease-out .45s forwards;
    }

    .broken {
      fill: none;
      stroke: rgba(255,248,235,.22);
      stroke-width: 1.2;
      stroke-dasharray: 32 28;
      stroke-dashoffset: 500;
      opacity: 0;
      animation: draw 1.5s ease-out .2s forwards;
    }

    .dot {
      fill: var(--gold);
      filter: drop-shadow(0 0 16px rgba(185,140,60,.58));
    }

    .caption {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 112px;
      text-align: center;
      color: #fff8eb;
      font: 400 27px/1.3 "PingFang SC", "Noto Sans SC", sans-serif;
      letter-spacing: 5px;
      opacity: 0;
      animation: fadeIn .9s ease-out 1.75s forwards;
    }

    .caption strong {
      color: var(--gold-soft);
      font-weight: 500;
    }

    .rule {
      position: absolute;
      left: 228px;
      right: 228px;
      bottom: 162px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(185,140,60,.68), transparent);
    }

    .footer {
      position: absolute;
      left: 132px;
      right: 132px;
      bottom: 64px;
      display: flex;
      justify-content: space-between;
      color: rgba(230,211,164,.42);
      font: 500 13px/1 "Avenir Next", sans-serif;
      letter-spacing: 7px;
      text-transform: uppercase;
    }

    body.final .copy,
    body.final .node,
    body.final .gap,
    body.final .caption,
    body.final .flow,
    body.final .broken {
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
      stroke-dashoffset: 0 !important;
    }

    @keyframes fadeUp {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes rise {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    @keyframes draw {
      to { opacity: 1; stroke-dashoffset: 0; }
    }
  </style>
</head>
<body>
  <main class="stage">
    <div class="frame"></div>
    <div class="eyebrow">PROBLEM DEFINITION</div>

    <section class="copy">
      <div class="kicker">OPENING · PROBLEM</div>
      <h1>剧播完后，<br>兴趣还在流动</h1>
      <p class="sub">真正流失的不是注意力，<br>而是承接它的下一层体验。</p>
    </section>

    <section class="diagram" aria-hidden="true">
      <svg viewBox="0 0 760 560">
        <path class="broken" d="M154 244 C266 224, 334 222, 410 234" />
        <path class="flow" d="M368 238 C470 112, 560 98, 646 92" />
        <path class="flow" d="M386 246 C490 246, 568 270, 640 282" />
        <path class="flow" d="M376 258 C470 382, 560 408, 656 404" />
        <path class="flow" d="M354 272 C408 436, 490 480, 512 508" />
        <circle class="dot" cx="154" cy="244" r="6" />
        <circle class="dot" cx="384" cy="246" r="5" />
      </svg>

      <div class="waterline"></div>
      <div class="home">腾讯视频<br>正片 IP<small>main content</small></div>
      <div class="gap">缺少<br>承接层</div>

      <div class="node a">讨论<small>discussion</small></div>
      <div class="node b">二创<small>remix</small></div>
      <div class="node c">考据<small>research</small></div>
      <div class="node d">复看<small>rewatch</small></div>
    </section>

    <div class="rule"></div>
    <div class="caption">剧后消费不该只在<strong>站外</strong>完成</div>
    <div class="footer">
      <span>QING YU · UNDERWATER</span>
      <span>VIDEO OPENING ASSET</span>
    </div>
  </main>

  <script>
    if (new URLSearchParams(location.search).has("final")) {
      document.body.classList.add("final");
    }
  </script>
</body>
</html>
