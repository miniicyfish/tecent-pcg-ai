<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>庆余年 · 水下 Product Intro</title>
  <style>
    :root {
      --ink: #06131d;
      --sea: #08263b;
      --water: #143e5c;
      --gold: #b98c3c;
      --gold-soft: #e6d3a4;
      --paper: #fff7ea;
      --muted: rgba(230, 211, 164, .58);
      --line: rgba(185, 140, 60, .48);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #071018;
      color: var(--paper);
      font-family: "Noto Serif SC", "Songti SC", "STSong", "PingFang SC", serif;
    }

    .stage {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 44%, rgba(43, 104, 134, .34), transparent 34%),
        radial-gradient(circle at 50% 70%, rgba(185, 140, 60, .10), transparent 30%),
        linear-gradient(180deg, #071b29 0%, #09283d 46%, #050e15 100%);
      isolation: isolate;
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(230,211,164,.026) 1px, transparent 1px),
        linear-gradient(90deg, rgba(230,211,164,.022) 1px, transparent 1px),
        radial-gradient(circle, rgba(255,255,255,.28) 0 1px, transparent 1px);
      background-size: 56px 56px, 56px 56px, 22px 24px;
      opacity: .66;
      z-index: -2;
    }

    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, rgba(0,0,0,.32), transparent 24%, transparent 78%, rgba(0,0,0,.34)),
        radial-gradient(ellipse at bottom, rgba(4, 12, 19, .74), transparent 52%);
      z-index: -1;
    }

    .frame {
      position: absolute;
      inset: 54px 64px;
      border: 1px solid rgba(185,140,60,.34);
      pointer-events: none;
    }

    .eyebrow {
      position: absolute;
      top: 104px;
      left: 50%;
      transform: translateX(-50%);
      padding: 9px 28px 8px;
      border: 1px solid rgba(185,140,60,.58);
      color: var(--gold-soft);
      font: 600 16px/1 "Avenir Next Condensed", "DIN Condensed", sans-serif;
      letter-spacing: 10px;
      text-transform: uppercase;
      background: rgba(6,19,29,.42);
      white-space: nowrap;
      opacity: 0;
      animation: appear 1s ease-out .35s forwards;
    }

    .waterline {
      position: absolute;
      left: 278px;
      right: 278px;
      top: 352px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(230,211,164,.76), transparent);
      opacity: 0;
      animation: appear 1.2s ease-out 1.15s forwards;
    }

    .waterline::after {
      content: "";
      position: absolute;
      left: 160px;
      right: 160px;
      top: 8px;
      height: 1px;
      background: repeating-linear-gradient(90deg, rgba(185,140,60,.50) 0 9px, transparent 9px 18px);
      opacity: .48;
    }

    .hook {
      position: absolute;
      top: 214px;
      left: 0;
      right: 0;
      text-align: center;
      color: var(--gold-soft);
      font: 400 30px/1.4 "PingFang SC", "Noto Sans SC", sans-serif;
      letter-spacing: 5px;
      opacity: 0;
      transform: translateY(14px);
      animation: rise 1.15s cubic-bezier(.2,.8,.2,1) .9s forwards;
    }

    .title-block {
      position: absolute;
      left: 0;
      right: 0;
      top: 402px;
      text-align: center;
    }

    .called {
      color: rgba(230,211,164,.72);
      font: 500 19px/1 "Avenir Next", "PingFang SC", sans-serif;
      letter-spacing: 9px;
      text-transform: uppercase;
      margin-bottom: 28px;
      opacity: 0;
      animation: appear .9s ease-out 2.25s forwards;
    }

    h1 {
      margin: 0;
      font-size: 104px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: 8px;
      color: #fff8eb;
      text-shadow: 0 0 34px rgba(255,248,235,.12);
      opacity: 0;
      transform: translateY(28px);
      animation: rise 1.2s cubic-bezier(.2,.8,.2,1) 2.65s forwards;
    }

    .subtitle {
      margin-top: 26px;
      color: var(--gold-soft);
      font: 400 31px/1.3 "PingFang SC", "Noto Sans SC", sans-serif;
      letter-spacing: 5px;
      opacity: 0;
      animation: appear 1.05s ease-out 3.65s forwards;
    }

    .motivation {
      position: absolute;
      left: 0;
      right: 0;
      top: 610px;
      text-align: center;
      pointer-events: none;
    }

    .motivation-line {
      position: absolute;
      left: 0;
      right: 0;
      color: #fff8eb;
      font: 400 34px/1.45 "PingFang SC", "Noto Sans SC", sans-serif;
      letter-spacing: 5px;
      opacity: 0;
      transform: translateY(18px);
      text-shadow: 0 0 22px rgba(255,248,235,.08);
    }

    .motivation-line strong {
      color: var(--gold-soft);
      font-weight: 500;
    }

    .motivation-line.a {
      animation: surfaceText 3.1s cubic-bezier(.2,.8,.2,1) 4.9s forwards;
    }

    .motivation-line.b {
      animation: surfaceText 3.1s cubic-bezier(.2,.8,.2,1) 7.3s forwards;
    }

    .berg {
      position: absolute;
      left: 50%;
      top: 322px;
      width: 360px;
      height: 340px;
      transform: translateX(-50%);
      pointer-events: none;
      opacity: .55;
      mix-blend-mode: screen;
    }

    .berg-top {
      position: absolute;
      left: 142px;
      top: 0;
      width: 78px;
      height: 82px;
      clip-path: polygon(34% 98%, 58% 0, 70% 72%, 100% 84%, 82% 100%);
      background: linear-gradient(135deg, #fff0ca, #a98542);
      opacity: 0;
      animation: appear 1.1s ease-out 2.15s forwards;
    }

    .berg-under {
      position: absolute;
      left: 108px;
      top: 84px;
      width: 152px;
      height: 158px;
      clip-path: polygon(18% 0, 70% 0, 100% 54%, 56% 100%, 0 65%);
      border: 1px solid rgba(185,140,60,.38);
      background: rgba(20, 62, 92, .18);
      opacity: 0;
      animation: appear 1.1s ease-out 2.35s forwards;
    }

    .cards {
      position: absolute;
      left: 208px;
      right: 208px;
      bottom: 204px;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 26px;
    }

    .card {
      min-height: 142px;
      border: 1px solid rgba(185,140,60,.44);
      background: rgba(6,19,29,.48);
      padding: 28px 30px;
      opacity: 0;
      transform: translateY(24px);
      animation: rise 1.35s cubic-bezier(.2,.8,.2,1) forwards;
    }

    .card:nth-child(1) { animation-delay: 10.75s; }
    .card:nth-child(2) { animation-delay: 12.05s; }
    .card:nth-child(3) { animation-delay: 13.35s; }

    .card .num {
      color: var(--gold);
      font: 600 13px/1 "Avenir Next", sans-serif;
      letter-spacing: 7px;
      text-transform: uppercase;
      margin-bottom: 15px;
    }

    .card p {
      margin: 0;
      color: #fff8eb;
      font: 500 25px/1.48 "PingFang SC", "Noto Sans SC", sans-serif;
      letter-spacing: 3px;
    }

    .card strong {
      color: var(--gold-soft);
      font-weight: 500;
    }

    .orbit {
      position: absolute;
      left: 50%;
      top: 546px;
      width: 740px;
      height: 220px;
      transform: translateX(-50%);
      opacity: 0;
      animation: appear 1.4s ease-out 10.05s forwards;
    }

    .orbit svg {
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    .path {
      fill: none;
      stroke: rgba(185,140,60,.38);
      stroke-width: 1.3;
      stroke-dasharray: 9 14;
      stroke-dashoffset: 620;
      animation: draw 4.4s ease-out 9.95s forwards;
    }

    .dot {
      fill: var(--gold);
      filter: drop-shadow(0 0 15px rgba(185,140,60,.54));
    }

    .rule {
      position: absolute;
      left: 228px;
      right: 228px;
      bottom: 162px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(185,140,60,.68), transparent);
    }

    .footer {
      position: absolute;
      left: 132px;
      right: 132px;
      bottom: 64px;
      display: flex;
      justify-content: space-between;
      color: rgba(230,211,164,.42);
      font: 500 13px/1 "Avenir Next", sans-serif;
      letter-spacing: 7px;
      text-transform: uppercase;
    }

    body.final .eyebrow,
    body.final .waterline,
    body.final .hook,
    body.final .called,
    body.final h1,
    body.final .subtitle,
    body.final .motivation-line,
    body.final .berg-top,
    body.final .berg-under,
    body.final .card,
    body.final .orbit {
      animation: none !important;
      opacity: 1 !important;
      transform: none !important;
    }

    body.final .motivation {
      display: none;
    }

    body.final .title-block,
    body.final .berg,
    body.final .orbit {
      transform: translateX(0) !important;
    }

    body.final .berg,
    body.final .orbit {
      left: 50%;
      transform: translateX(-50%) !important;
    }

    body.final .path {
      animation: none !important;
      stroke-dashoffset: 0 !important;
    }

    @keyframes appear {
      to { opacity: 1; }
    }

    @keyframes rise {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes draw {
      to { stroke-dashoffset: 0; }
    }

    @keyframes surfaceText {
      0% { opacity: 0; transform: translateY(18px); filter: blur(4px); }
      16% { opacity: 1; transform: translateY(0); filter: blur(0); }
      74% { opacity: 1; transform: translateY(0); filter: blur(0); }
      100% { opacity: 0; transform: translateY(-18px); filter: blur(5px); }
    }
  </style>
</head>
<body>
  <main class="stage">
    <div class="frame"></div>
    <div class="eyebrow">PRODUCT INTRODUCTION</div>

    <div class="hook">我们做了一款产品，把这一切留在站内。</div>
    <div class="waterline"></div>

    <div class="berg" aria-hidden="true">
      <div class="berg-top"></div>
      <div class="berg-under"></div>
    </div>

    <section class="title-block">
      <div class="called">IT IS CALLED</div>
      <h1>庆余年 · 水下</h1>
      <div class="subtitle">一个长视频 IP 的 AI 衍生交互层</div>
    </section>

    <section class="motivation" aria-label="用户动机">
      <div class="motivation-line a">当用户想<strong>更深入理解一部剧</strong></div>
      <div class="motivation-line b">想探索<strong>更多面的叙事</strong>时</div>
    </section>

    <div class="orbit" aria-hidden="true">
      <svg viewBox="0 0 740 220">
        <path class="path" d="M78 112 C190 22, 322 18, 370 104 S548 196, 664 94" />
        <circle class="dot" cx="78" cy="112" r="6" />
        <circle class="dot" cx="370" cy="104" r="6" />
        <circle class="dot" cx="664" cy="94" r="6" />
      </svg>
    </div>

    <section class="cards">
      <article class="card">
        <div class="num">01 · ENTER</div>
        <p>以<strong>原住民</strong>身份进入官方叙事构筑的世界</p>
      </article>
      <article class="card">
        <div class="num">02 · VIEW</div>
        <p><strong>主线不被改写</strong>，但观看视角可以改变</p>
      </article>
      <article class="card">
        <div class="num">03 · DISCOVER</div>
        <p>通过<strong>四种 AI 驱动的交互方式</strong>发现被覆盖的故事</p>
      </article>
    </section>

    <div class="rule"></div>
    <div class="footer">
      <span>QING YU · UNDERWATER</span>
      <span>VIDEO PRODUCT INTRO ASSET</span>
    </div>
  </main>

  <script>
    if (new URLSearchParams(location.search).has("final")) {
      document.body.classList.add("final");
    }
  </script>
</body>
</html>
