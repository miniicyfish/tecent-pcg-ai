<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>IP Library Concept</title>
  <style>
    :root {
      --ink: #06121a;
      --deep: #071b29;
      --mid: #0d314a;
      --gold: #c79b45;
      --gold-soft: #e8d8ad;
      --paper: #f4eee2;
      --muted: rgba(232, 216, 173, .62);
      --line: rgba(199, 155, 69, .46);
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      background: #111;
      font-family: "Songti SC", "STSong", "Noto Serif CJK SC", "PingFang SC", serif;
      color: var(--paper);
      overflow: hidden;
    }

    .stage {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      background:
        radial-gradient(circle at 49% 48%, rgba(31, 93, 127, .34) 0, rgba(7, 27, 41, .12) 32%, transparent 55%),
        linear-gradient(180deg, #071a27 0%, #082236 43%, #061018 100%);
      isolation: isolate;
    }

    .stage::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(232, 216, 173, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(232, 216, 173, .025) 1px, transparent 1px);
      background-size: 52px 52px, 52px 52px;
      mask-image: radial-gradient(circle at center, black 0%, transparent 72%);
      z-index: -2;
    }

    .stage::after {
      content: "";
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 28% 28%, rgba(199, 155, 69, .10), transparent 18%),
        radial-gradient(circle at 72% 62%, rgba(87, 149, 174, .13), transparent 24%),
        linear-gradient(90deg, rgba(0,0,0,.22), transparent 24%, transparent 76%, rgba(0,0,0,.28));
      z-index: -1;
    }

    .frame {
      position: absolute;
      inset: 54px 64px;
      border: 1px solid rgba(199, 155, 69, .36);
    }

    .frame::before,
    .frame::after {
      content: "";
      position: absolute;
      top: 50%;
      width: 180px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(199, 155, 69, .62), transparent);
    }

    .frame::before { left: 70px; }
    .frame::after { right: 70px; }

    .eyebrow {
      position: absolute;
      top: 114px;
      left: 50%;
      transform: translateX(-50%);
      padding: 9px 28px 8px;
      border: 1px solid rgba(199, 155, 69, .58);
      color: var(--gold-soft);
      font: 500 17px/1 "DIN Condensed", "Avenir Next Condensed", sans-serif;
      letter-spacing: 11px;
      text-transform: uppercase;
      background: rgba(6, 18, 26, .44);
    }

    .iceberg {
      position: absolute;
      left: 286px;
      top: 286px;
      width: 470px;
      height: 360px;
    }

    .waterline {
      position: absolute;
      left: 18px;
      right: 28px;
      top: 137px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(232,216,173,.82), transparent);
      opacity: .8;
    }

    .waterline::after {
      content: "";
      position: absolute;
      left: 92px;
      right: 76px;
      top: 8px;
      height: 1px;
      background: repeating-linear-gradient(90deg, rgba(199,155,69,.54) 0 9px, transparent 9px 17px);
      opacity: .42;
    }

    .berg-top {
      position: absolute;
      left: 184px;
      top: 25px;
      width: 145px;
      height: 122px;
      clip-path: polygon(33% 95%, 54% 0, 68% 71%, 100% 80%, 84% 100%);
      background: linear-gradient(135deg, #f4ead5, #a98542 72%);
      filter: drop-shadow(0 12px 30px rgba(199,155,69,.18));
    }

    .berg-under {
      position: absolute;
      left: 150px;
      top: 136px;
      width: 224px;
      height: 248px;
      clip-path: polygon(20% 4%, 72% 0, 100% 48%, 57% 100%, 0 68%);
      border: 1px solid rgba(199,155,69,.48);
      background: linear-gradient(180deg, rgba(199,155,69,.08), rgba(20, 68, 98, .05));
      opacity: .72;
    }

    .left-title {
      position: absolute;
      left: 232px;
      top: 580px;
      width: 590px;
    }

    .left-title .label {
      margin-bottom: 22px;
      color: var(--gold);
      font: 600 15px/1 "Avenir Next", "PingFang SC", sans-serif;
      letter-spacing: 9px;
      text-transform: uppercase;
    }

    .left-title h1 {
      margin: 0;
      font-size: 84px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: 4px;
      color: #fff7ea;
      text-shadow: 0 0 28px rgba(255,247,234,.12);
    }

    .landed {
      display: inline-flex;
      margin-top: 24px;
      padding: 8px 18px 7px;
      border: 1px solid rgba(199,155,69,.62);
      color: var(--gold-soft);
      font: 500 18px/1 "PingFang SC", sans-serif;
      letter-spacing: 5px;
      background: rgba(199,155,69,.08);
    }

    .axis {
      position: absolute;
      left: 840px;
      top: 210px;
      width: 700px;
      height: 610px;
    }

    .axis svg {
      position: absolute;
      inset: 0;
      overflow: visible;
    }

    .route {
      fill: none;
      stroke: rgba(199, 155, 69, .42);
      stroke-width: 1.4;
      stroke-dasharray: 8 12;
      animation: draw 5s ease-out both;
    }

    .ip {
      position: absolute;
      display: grid;
      grid-template-columns: 22px auto;
      align-items: center;
      gap: 18px;
      min-width: 390px;
      color: #fff8e9;
      opacity: 0;
      transform: translateY(18px);
      animation: rise .75s cubic-bezier(.2,.8,.2,1) forwards;
    }

    .ip:nth-of-type(1) { left: 116px; top: 52px; animation-delay: .45s; }
    .ip:nth-of-type(2) { left: 236px; top: 190px; animation-delay: 1.35s; }
    .ip:nth-of-type(3) { left: 92px; top: 330px; animation-delay: 2.25s; }
    .ip:nth-of-type(4) { left: 258px; top: 468px; animation-delay: 3.15s; }

    .dot {
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 0 8px rgba(199,155,69,.08), 0 0 30px rgba(199,155,69,.35);
    }

    .ip span {
      font-size: 43px;
      line-height: 1;
      font-weight: 600;
      letter-spacing: 3px;
      white-space: nowrap;
    }

    .ip small {
      display: block;
      margin-top: 13px;
      color: var(--muted);
      font: 500 14px/1 "Avenir Next", "PingFang SC", sans-serif;
      letter-spacing: 8px;
      text-transform: uppercase;
    }

    .bottom-rule {
      position: absolute;
      left: 232px;
      right: 232px;
      bottom: 166px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(199,155,69,.72), transparent);
    }

    .statement {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 100px;
      text-align: center;
      color: #f2e8d2;
      font: 400 26px/1.2 "PingFang SC", "Songti SC", serif;
      letter-spacing: 5px;
      opacity: 0;
      animation: fadeIn .9s ease-out 4.05s forwards;
    }

    .statement strong {
      color: var(--gold-soft);
      font-weight: 500;
    }

    .footer {
      position: absolute;
      left: 118px;
      right: 118px;
      bottom: 60px;
      display: flex;
      justify-content: space-between;
      color: rgba(232,216,173,.44);
      font: 500 13px/1 "Avenir Next", sans-serif;
      letter-spacing: 7px;
      text-transform: uppercase;
    }

    .grain {
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .16;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.5) 0 1px, transparent 1px);
      background-size: 17px 19px;
      mix-blend-mode: overlay;
    }

    @keyframes rise {
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    @keyframes draw {
      from { stroke-dashoffset: 760; opacity: .08; }
      to { stroke-dashoffset: 0; opacity: 1; }
    }

    body.final-frame .ip,
    body.final-frame .statement,
    body.final-frame .route {
      animation: none;
      opacity: 1;
      transform: none;
      stroke-dashoffset: 0;
    }
  </style>
</head>
<body>
  <main class="stage">
    <div class="frame"></div>
    <div class="eyebrow">TENCENT VIDEO IP UNDERWATER FRAMEWORK</div>

    <section class="iceberg" aria-hidden="true">
      <div class="berg-top"></div>
      <div class="waterline"></div>
      <div class="berg-under"></div>
    </section>

    <section class="left-title">
      <div class="label">LANDED PILOT</div>
      <h1>庆余年 · 水下</h1>
      <div class="landed">已落地</div>
    </section>

    <section class="axis">
      <svg viewBox="0 0 700 610" aria-hidden="true">
        <path class="route" d="M10 355 C125 245, 170 84, 274 88 S404 230, 342 306 S284 480, 430 505 S602 414, 620 302" />
        <circle cx="10" cy="355" r="4" fill="rgba(199,155,69,.9)" />
        <circle cx="274" cy="88" r="4" fill="rgba(199,155,69,.9)" />
        <circle cx="342" cy="306" r="4" fill="rgba(199,155,69,.9)" />
        <circle cx="430" cy="505" r="4" fill="rgba(199,155,69,.9)" />
        <circle cx="620" cy="302" r="4" fill="rgba(199,155,69,.9)" />
      </svg>

      <div class="ip">
        <i class="dot"></i>
        <div><span>繁花 · 水下</span><small>Urban memory</small></div>
      </div>
      <div class="ip">
        <i class="dot"></i>
        <div><span>三体 · 水下</span><small>Cosmic hidden layer</small></div>
      </div>
      <div class="ip">
        <i class="dot"></i>
        <div><span>玫瑰的故事 · 水下</span><small>Intimate perspective</small></div>
      </div>
      <div class="ip">
        <i class="dot"></i>
        <div><span>五十公里桃花坞 · 水下</span><small>Reality social field</small></div>
      </div>
    </section>

    <div class="bottom-rule"></div>
    <div class="statement">同一套框架，可迁移到<strong>腾讯视频整个 IP 库</strong></div>
    <div class="footer">
      <span>PCG · AI · COMPETITION</span>
      <span>VIDEO CONCEPT ASSET</span>
    </div>
    <div class="grain"></div>
  </main>
  <script>
    if (new URLSearchParams(window.location.search).has("final")) {
      document.body.classList.add("final-frame");
    }
  </script>
</body>
</html>
